*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}a{color:#156a69;word-break:break-all}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{background:#162b32;color:white;padding:24px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:25px;font-weight:750;letter-spacing:.6px}.kicker{font-size:11px;font-weight:750;letter-spacing:2px;color:#a1c7ba}.sub{font-size:13px;color:#c1d2d0}.top .hint{font-size:12px;background:#234348;padding:8px 12px;border-radius:30px;color:#d1e3dd}main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:22px;padding:5px;border:1px solid var(--line);border-radius:13px;background:#e9efec}.tabs button{flex:1;white-space:nowrap;border:0;border-radius:9px;background:transparent;padding:10px 16px;color:#4d6369;font-weight:650}.tabs button.active{color:#fff;background:#176d69}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 5px #152d3010}.card h2,.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stat strong{font-size:29px;display:block;letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}.small{font-size:13px;color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.lead{font-size:15px;color:#44555e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #cbdad5;background:white;color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:650}.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.btn.soft{background:#e6f1ea;border-color:#d3e4dc;color:#155f52}.btn.danger{border-color:#e8 order-color:#d7797d;background:#fff0f0}.optionletter{font-weight:800;min-width:19px}.numgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin-top:10px}.qnum{border:1px solid #d6e0dd;background:white;padding:7px 2px;border-radius:7px;font-size:12px}.qnum.done{background:#e7f4ec;color:#155e4d}.qnum.now{background:#175e5b;color:white;border-color:#175e5b}.qnum.failed{border-color:#d1787d;background:#fff0f0}.reportrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.reportrow:last-child{border:0}.pill{font-size:12px;padding:3px 7px;border-radius:20px;background:#e9f0ed;color:#43585c}.sourcebox{font-size:12px;color:#5c6d71;line-height:1.9}.sourcebox a{display:inline-block;margin-right:12px}.right{text-align:right}.muted{color:var(--muted)}.help{font-size:12px;color:#62777b;margin-top:4px}.footer{margin-top:30px;text-align:center;font-size:12px;color:#637778}.fileinput{display:none}.scrollbox{max-height:410px;overflow:auto}.reviewitem{padding:15px 0;border-bottom:1px solid var(--line)}.reviewitem:last-child{border:0}.explain{border-radius:11px;background:#f5f8f7;padding:15px;margin-top:14px}.em{font-size:14px;color:#31484d}.linkbtn{border:0;color:#13706a;background:none;padding:0 3px;text-decoration:underline;cursor:pointer;font-weight:600}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.toast{position:fixed;right:22px;bottom:20px;z-index:6;border-radius:10px;padding:13px 17px;background:#1c3f43;color:#fff;box-shadow:0 10px 30px #0003;max-width:340px;font-size:14px}.hidden{display:none!important}.setupgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.yearbox{align-items:flex-start;flex-direction:column}.yearaction{width:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.yearaction .btn{font-size:12px;padding:6px 9px}.modeNote{padding:12px 14px;border-radius:10px;background:#ecf5f0;color:#31544b;font-size:13px;margin:12px 0}.modeNote.warn{background:#fff4de;color:#76 <script>
'use strict';
const ARCHIVE='https://pain.org.tw/index.php/exam_page/index/6/1';
const YEARS=Array.from({length:10},(_,i)=>115-i);const BONUS_YEARS=[105];
const SEEDS=window.PAIN_EXAM_SEEDS||[];
const STORE='pain_exam_v2';
const DRAFT_STORE='pain_exam_drafts_v1';
let state={bank:[...SEEDS],attempts:{},completedYears:{},tab:'home',session:null,setupYear:'115',reviewYear:'all',reviewSearch:'',importNote:'',drafts:{}};
try{let saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&Array.isArray(saved.bank)){const merged=new Map(SEEDS.map(q=>[q.id,q]));for(const old of saved.bank){if(!old||!old.id)continue;const fresh=merged.get(old.id);if(!fresh){merged.set(old.id,old);continue;}if(old.verified==='verified'||old.verified==='disputed'||old.explanation){merged.set(old.id,{...fresh,verifiedAnswer:old.verifiedAnswer||null,verified:old.verified||'pending',explanation:old.explanation||'',sources:old.verified==='verified'?old.sources:fresh.sources});}}state.bank=[...merged.values()];state.attempts=saved.attempts||{};state.completedYears=saved.completedYears||{}}}catch(e){}
try{const savedDrafts=JSON.parse(localStorage.getItem(DRAFT_STORE)||'{}');if(savedDrafts&&typeof savedDrafts==='object'&&!Array.isArray(savedDrafts))state.drafts=savedDrafts;}catch(e){}
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const answer=q=>q.verifiedAnswer||q.officialAnswer||null;
const able=q=>Array.isArray(q.options)&&q.options.filter(o=>String(o||'').trim()).length>=4&&!!answer(q)&&!!q.options['ABCDE'.indexOf(answer(q))];
function save(){try{localStorage.setItem(STORE,JSON.stringify({bank:state.bank,attempts:state.attempts,completedYears:state.completedYears}));return true;}catch(e){toast('瀏覽器儲存空間不足，請先匯出題庫備份。');return false;}}
function saveDrafts(){try{localStorage.setItem(DRAFT_STORE,JSON.stringify(state.drafts));return true;}catch(e){toast('暫存失敗：瀏覽器儲存空間不足。請匯出 JSON 備份。');return false;}}
function persistDraft(){const s=state.session;if(!s||s.submitted||s.mode!=='exam'||!s.fullYear||s.year===null)return true;state.drafts[String(s.year)]={year:s.year,ids:[...s.ids],answers:{...s.answers},index:s.index,savedAt:new Date().toISOString()};return saveDrafts();}
function draftCount(y){const d=state.drafts[String(y)];return d&&d.answers&&typeof d.answers==='object'?Object.values(d.answers).filter(a=>typeof a==='string'&&/^[A-E]$/.test(a)).length:0;}
function resumeYear(y){y=Number(y);const d=state.drafts[String(y)];if(!d){toast('沒有可繼續的暫存紀錄。');return false;}const ids=yearQuestions(y).filter(able).map(q=>q.id);if(!ids.length){toast('本年度題庫目前無法作答。');return false;}const answers={};for(const id of ids){const a=d.answers?.[id];if(typeof a==='string'&&/^[A-E]$/.test(a))answers[id]=a;}const index=Number.isInteger(d.index)?Math.min(Math.max(d.index,0),ids.length-1):0;state.setupYear=String(y);state.session={ids,index,answers,submitted:false,mode:'exam',year:y,fullYear:true,revealed:{}};persistDraft();render();window.scrollTo(0,0);return true;}
function suspendExam(){const s=state.session;if(!s||s.submitted||s.mode!=='exam'||!s.fullYear)return;if(!persistDraft())return;state.session=null;state.tab='home';render();window.scrollTo(0,0);toast('已暫存作答進度。下次可選擇「繼續作答」。');}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3800)}
function nav(tab){state.tab=tab;render();window.scrollTo(0,0)}
function render(){const tabs=[['home','總覽與題庫'],['setup','開始測驗'],['wrong','錯題複習']];$('#tabs').innerHTML=tabs.map(([id,label])=>`<button data-nav="${id}" class="${state.tab===id?'active':''}">${label}</button>`).join('');const app=$('#app');app.innerHTML=state.session?(state.session.submitted?renderResults():renderQuiz()):({home:renderHome,setup:renderSetup,wrong:renderWrong}[state.tab]||renderHome)();}
function status(q){return q.verified==='verified'?'<span class="badge good">已獨立核對</span>':q.verified==='disputed'?'<span class="badge bad">答案有爭議</span>':q.explanation?'<span class="badge warn">已寫詳解・待複核</span>':'<span class="badge warn">詳解尚待撰寫</span>'}
function yearQuestions(y){const year=Number(y),official=state.bank.filter(q=>q.year===year&&q.origin==='official');return (official.length?official:state.bank.filter(q=>q.year===year)).slice().sort((a,b)=>a.number-b.number)}
function yearComplete(y){const all=yearQuestions(y),old=state.completedYears[String(y)];return !!(old&&all.length&&all.every(q=>able(q)&&old.ids.includes(q.id)))}
function officialYearComplete(y){return yearComplete(y)&&yearQuestions(y).some(q=>q.origin==='official')}
function flagged(q){const a=state.attempts[q.id];return !!(a&&(a.wrong||0)>0&&!a.mastered)}
function tallyAttempt(id,picked){const q=state.bank.find(x=>x.id===id);if(!q)return;const prev=state.attempts[id]||{count:0,wrong:0,mastered:false};const correct=!!picked&&picked===answer(q);state.attempts[id]={...prev,count:(prev.count||0)+1,wrong:(prev.wrong||0)+(correct?0:1),mastered:correct?!!prev.mastered:false,lastCorrect:correct,lastAnswer:picked||null,lastAt:new Date().toISOString()};}
function startYear(y,mode='exam'){y=Number(y);if(mode==='exam'&&state.drafts[String(y)]){resumeYear(y);return;}const qs=yearQuestions(y);if(!qs.length){toast(y+' 年尚未匯入可練習的題目。');return}const missing=qs.filter(q=>!able(q));if(missing.length){toast(y+' 年有 '+missing.length+' 題缺少完整選項或答案，請先校對題目。');return}if(mode==='instant'&&!yearComplete(y)){toast('請先完成該年度整份模擬考，才會開放逐題即時複習。');return}state.setupYear=String(y);startQuiz(qs.map(q=>q.id),false,mode,y,true)}
function answerPanel(q,chosen){const correct=answer(q),ok=!!chosen&&chosen===correct;return `<div class="answerbox ${ok?'':'bad'}"><div class="row wrap"><strong>${ok?'本題答對':'本題答錯／未作答'}</strong>${status(q)}</div><p>你的選擇：<strong>${chosen||'未作答'}</strong>　｜　${q.origin==='official'?`官方答案：<strong>${q.officialAnswer||'未辨識'}</strong>`:`查證答案：<strong>${correct||'未設定'}</strong>`}</p>${q.verifiedAnswer&&q.officialAnswer&&q.verifiedAnswer!==q.officialAnswer?`<div class="notice warning">官方答案為 ${q.officialAnswer}，獨立查證為 ${q.verifiedAnswer}；此題需要閱讀爭議說明。</div>`:''}<p class="em">${escapeHTML(q.explanation||'此題尚缺少經醫學文獻獨立驗證的詳解，目前只能依原始答案鍵暫定計分。')}</p>${q.officialNote?`<p class="small">原題附註：${escapeHTML(q.officialNote)}</p>`:''}${q.parseWarning&&q.parseWarning.length?`<div class="notice warning">擷取校對提醒：${escapeHTML(q.parseWarning.join('；'))}</div>`:''}<div class="sourcebox">${(q.sources||[]).length?q.sources.map(x=>`<a target="_blank" rel="noopener" href="${escapeHTML(x.url)}">${escapeHTML(x.title||'文獻來源')} ↗</a>`).join(''):'尚未加入查證來源'}</div>${q.origin==='official'&&q.verified!=='verified'?'<p class="small">提醒：官方答案尚未經獨立核對，錯題標記與得分均屬暫定。</p>':''}</div>`}

function renderHome(){const imported=state.bank.filter(q=>q.origin==='official'),solved=Object.values(state.attempts).filter(a=>a.count>0),wrong=state.bank.filter(flagged).length,yearsDone=YEARS.filter(officialYearComplete).length;return `<div class="grid"><section class="card stat"><span>題庫題數</span><strong>${state.bank.length}</strong><span>正式十年 106～115 年共 499 題（107 年原卷 49 題），105 年另有 50 題</span></section><section class="card stat"><span>已完成年度</span><strong>${yearsDone} / 10</strong><span>僅計入已完成的 106～115 年整份測驗</span></section><section class="card stat"><span>標記錯題</span><strong>${wrong}</strong><span>即使重做答對，仍保留至手動標記熟悉</span></section></div><div class="sp"></div><div class="two"><section class="card"><div class="row wrap"><h2>十年年度練習</h2><span class="badge">民國 106–115 年</span></div><div class="notice"><strong>第一次：</strong>答到一半可以暫存離開，回來接續作答；全部答完、正式交卷後才看每題答案與詳解。<strong>已完成年度：</strong>可逐題作答、立即看對錯和解析，再進下一題。已收錄原始題目與官方答案，詳解會分批補充。</div><div class="yeargrid">${YEARS.map(y=>{const official=imported.filter(q=>q.year===y).length,qs=yearQuestions(y),ready=qs.length&&qs.every(able),done=yearComplete(y),draft=state.drafts[String(y)],demo=!official&&qs.length>0;return `<div class="yearbox"><div class="row wrap" style="width:100%"><strong>${y} 年 <span class="tiny">(${y+1911})</span></strong><span class="badge ${done?'good':ready?'warn':''}">${done?official?'本年度已完成':'示範題已完成':ready?'可以開始':'題庫待校對'}</span></div><div class="tiny">${draft?`<strong>已暫存：${draftCount(y)}／${qs.length} 題，尚未交卷</strong>　` : ''}${official?official+' 題官方原題'+(y===107?'（原始檔僅 49 題）':''):demo?qs.length+' 題示範題（非整份原題）':'題庫待校對'}</div><div class="yearaction">${qs.length?`<button class="btn ${done?'':'primary'}" data-action="year-start" data-year="${y}" data-mode="exam" ${ready?'':'disabled'}>${draft?'繼續作答（'+draftCount(y)+'／'+qs.length+'）':done?'重做整份':'第一次整份作答'}</button>`:''}${done?`<button class="btn primary" data-action="year-start" data-year="${y}" data-mode="instant">逐題即時複習</button>`:''}</div></div>`}).join('')}</div><div class="sp"></div><div class="notice warning"><strong>105 年額外練習（不計入 106～115 年十年進度）</strong><p class="small">105 年（2016）考題完整 50 題與官方答案已額外收錄，不列入正式 106～115 年十年完成率。</p><div class="actions"><button class="btn primary" data-action="year-start" data-year="105" data-mode="exam">${state.drafts['105']?'繼續 105 年作答（'+draftCount(105)+'／50）':yearComplete(105)?'重做 105 年整份':'開始 105 年整份作答'}</button>${yearComplete(105)?'<button class="btn" data-action="year-start" data-year="105" data-mode="instant">105 年逐題即時複習</button>':''}</div></div><div class="actions"><a class="btn soft" href="${ARCHIVE}" target="_blank" rel="noopener" style="text-decoration:none">官方十年考題</a><button class="btn" data-nav="setup">年度測驗設定</button></div></section><section class="card"><h2>學習進度備份</h2><p class="lead">考古題已建置於網站，後續由 GitHub 持續更新。作答紀錄、各年度完成狀態與錯題保存在目前瀏覽器，不會隨網站更新而自動同步到其他裝置。</p><div class="actions"><button class="btn" data-action="import-json">還原 JSON 備份</button><button class="btn primary" data-action="export">匯出學習進度備份</button></div><div class="notice warning">目前收錄 106～115 年正式考古題 499 題，另有 105 年 50 題加練。<strong>115 年與 114 年各 50 題，已寫入共 100 題詳解。</strong> 全部 549 題都有官方答案；詳解與醫學文獻查證進度會分開呈現。<strong>已獨立核對 ${state.bank.filter(q=>q.verified==='verified').length} 題，答案有爭議 ${state.bank.filter(q=>q.verified==='disputed').length} 題，尚待查證 ${state.bank.filter(q=>q.verified==='pending').length} 題。</strong> 原始卷面有少數圖表或擷取疑點，需回看學會文件。</div><div class="hr"></div><h3>複習節奏</h3><p class="small"><strong>第一輪：</strong>選擇 106～115 年或 105 年加練整份作答 → 全部交卷 → 逐題檢討 → 下一年。<br><strong>第二輪：</strong>點選已完成年度的「逐題即時複習」，每題確認後才顯示答案與詳解。<br><strong>錯題簿：</strong>錯過就保留標記，直到你主動改成「已熟悉」。</p><div class="hr"></div><h3>部分題目有爭議</h3><div class="notice warning">部分官方考題可能有印刷筆誤、舊版知識或爭議答案。我們保留原答案鍵，<strong>只會在交卷後或逐題確認作答後顯示具體爭議與詳解</strong>，不提前暴露解答。</div><div class="sp"></div><button class="btn primary" data-nav="wrong">查看我曾經答錯的題目</button></section></div>`}
function renderSetup(){const y=Number(state.setupYear),qs=yearQuestions(y),done=yearComplete(y),draft=state.drafts[String(y)],ready=qs.length&&qs.every(able);return `<section class="card"><h2>年度測驗設定</h2><p class="lead">第一次可以中途暫存，保留所有已選答案，等全部答完後才交卷。這一年完成後，才解鎖逐題作答、立即檢討的第二輪模式。</p><div class="formgrid setupgrid"><label class="field">選擇年度<select id="yearSelect">${[...YEARS,105].map(z=>`<option value="${z}" ${z===y?'selected':''}>${z} 年（${z+1911}）${z===105?'・額外練習':''}${yearComplete(z)?' ✓ 已完成':''}</option>`).join('')}</select></label><label class="field">練習模式<select id="modeSelect"><option value="exam">整份作答 → 交卷檢討</option>${done?'<option value="instant">逐題作答 → 即時解析</option>':''}</select></label></div><div class="modeNote ${done?'':'warn'}">${done?'這一年已完成第一輪，可以選「逐題作答 → 即時解析」；也能重新做一次整份模擬考。':`這一年尚未完成第一輪。${qs.length?`目前有 ${qs.length} 題${qs.some(q=>q.origin==='official')?'官方原題':'改寫示範題'}。`:'目前沒有題目。'}交卷前不會顯示任何答案。`}${draft?`　<strong>暫存進度：${draftCount(y)}／${qs.length} 題，尚未交卷。</strong>`:''}</div><div class="ctaFull"><button class="btn primary" data-action="start" ${ready?'':'disabled'}>${draft?'繼續 '+y+' 年作答':'開始 '+y+' 年練習'}</button>${draft?`<button class="btn" data-action="restart-year" data-year="${y}">捨棄暫存並重新開始</button>`:''}<span class="small">${ready?`本次 ${qs.length} 題，依原題題號順序、不抽題。`:'請先將這年的題目與答案補齊。'}</span></div><div class="hr"></div><p class="small">兩種模式都會記錄作答結果。錯過的題目會保留在「錯題複習」；答對也不會自動清除歷史錯題標記。詳解若缺乏文獻查證，會明確標示未核對。</p><button class="btn" data-nav="home">返回十年年度列表</button></section>`}
function renderQuiz(){const s=state.session,q=state.bank.find(x=>x.id===s.ids[s.index]);if(!q){state.session=null;return renderSetup()}const instant=s.mode==='instant',revealed=!!s.revealed[q.id],count=instant?Object.keys(s.revealed).length:Object.values(s.answers).filter(Boolean).length,chosen=s.answers[q.id];return `<div class="two"><section class="card"><div class="row wrap"><span class="badge">${q.year} 年第 ${q.number} 題</span><span class="small">${s.index+1} / ${s.ids.length} 題　${instant?'逐題即時複習':'整份模擬考'}</span></div><div class="sp"></div><div class="progress"><div style="width:${pct(count,s.ids.length)}%"></div></div><p class="small">${instant?'已確認':'已作答'} ${count} / ${s.ids.length} 題　｜　${q.origin==='adapted'?'改寫示範題':'官方原始題'}</p><div class="sp"></div><div class="question">${escapeHTML(q.text)}</div>${q.imageData?`<figure style="margin:14px 0"><img src="${q.imageData}" alt="${escapeHTML(q.imageAlt||'原始題目圖片')}" style="max-width:100%;max-height:650px;object-fit:contain;border:1px solid #dde5e7;border-radius:8px"/><figcaption class="tiny">原始考題附圖。含表格的題目，請以圖片排版為準。</figcaption></figure>`:''}<div class="sp"></div>${q.options.map((opt,i)=>{if(!String(opt||'').trim())return '';const a='ABCDE'[i];return `<label class="choice ${chosen===a?'selected':''} ${revealed&&a===answer(q)?'correct':''} ${revealed&&chosen===a&&chosen!==answer(q)?'wrong':''}"><input type="radio" name="answer" value="${a}" ${chosen===a?'checked':''} ${revealed?'disabled':''}><span class="optionletter">${a}.</span><span>${escapeHTML(opt)}</span></label>`}).join('')}${revealed?answerPanel(q,chosen):''}<div class="hr"></div>${instant?`<div class="row wrap">${revealed?`<span class="badge ${chosen===answer(q)?'good':'bad'}">${chosen===answer(q)?'答對':'答錯，已自動標記錯題'}</span><button class="btn primary" data-action="next-instant">${s.index===s.ids.length-1?'完成本輪並看成績':'下一題 →'}</button>`:`<span class="small">選好答案再確認，揭曉後不能修改這題。</span><button class="btn primary" data-action="confirm-instant" ${chosen?'':'disabled'}>確認本題並看解析</button>`}</div>`:`<div class="row wrap"><button class="btn" data-action="prev" ${s.index===0?'disabled':''}>上一題</button><div class="actions" style="margin:0"><button class="btn" data-action="next" ${s.index===s.ids.length-1?'disabled':''}>下一題</button><button class="btn" data-action="save-exam">暫存並離開</button><button class="btn primary" data-action="submit">全部交卷／看詳解</button></div></div>`}</section><aside class="card"><h3>${instant?'逐題進度':'答題卡'}</h3><p class="small">${instant?'每題確認後立即揭曉正誤、詳解及來源；不能在揭曉前跳題。':'可自由跳題，選項會自動暫存。暫存離開不計分、不解鎖第二輪；正式交卷前絕不顯示答案。'}</p>${instant?`<div class="modeNote">第 ${s.index+1} 題，共 ${s.ids.length} 題。${revealed?'已記入作答歷史。':'尚未記入作答歷史。'}</div>`:`<div class="numgrid">${s.ids.map((id,i)=>`<button class="qnum ${s.answers[id]?'done':''} ${i===s.index?'now':''}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div>`}<div class="hr"></div><p class="small">${s.fullYear?'本回涵蓋目前已匯入該年度的全部可用題目。':'本回為錯題或自選練習。'}${s.year!==null&&!state.bank.some(x=>x.year===s.year&&x.origin==='official')?' ⚠️ 目前只有改寫示範題，不代表整年度官方題庫。':''}</p></aside></div>`}
function renderResults(){const s=state.session,score=s.ids.reduce((sum,id)=>{const q=state.bank.find(x=>x.id===id);return sum+(s.answers[id]&&s.answers[id]===answer(q)?1:0)},0),unresolved=s.ids.filter(id=>state.bank.find(q=>q.id===id)?.verified!=='verified').length,id=s.ids[s.index],q=state.bank.find(x=>x.id===id),chosen=s.answers[id],correct=answer(q),ok=chosen===correct&&!!chosen,ny=s.fullYear&&s.year!==null?s.year+1:null,nextAvailable=ny&&ny<=115&&yearQuestions(ny).length>0;return `<div class="grid"><section class="card stat"><span>本輪得分（含暫定答案）</span><strong>${score} / ${s.ids.length}</strong><span>${pct(score,s.ids.length)}% 正確率</span></section><section class="card stat"><span>答錯或未作答</span><strong>${s.ids.length-score}</strong><span>已加入歷史錯題紀錄</span></section><section class="card stat"><span>未獨立核對</span><strong>${unresolved}</strong><span>詳解還需醫學文獻驗證</span></section></div><div class="sp"></div><div class="two"><section class="card"><div class="row wrap"><h2>${s.mode==='instant'?'即時複習完成':'整份交卷 · 逐題檢討'}</h2><span class="badge ${ok?'good':'bad'}">${ok?'正確':'待複習'}</span></div>${s.fullYear&&yearComplete(s.year)?`<div class="modeNote">${s.year} 年的${officialYearComplete(s.year)?'官方已匯入題目':'改寫示範題'}已完成，之後可以切換『逐題即時複習』。${officialYearComplete(s.year)?'':'這不代表完成整年度官方考古題。'}</div>`:''}<div class="row wrap"><span class="small">${q.year} 年第 ${q.number} 題 · ${escapeHTML(q.topic||'未分類')}</span>${status(q)}</div><div class="sp"></div><div class="question">${escapeHTML(q.text)}</div>${q.imageData?`<figure style="margin:14px 0"><img src="${q.imageData}" alt="${escapeHTML(q.imageAlt||'原始題目圖片')}" style="max-width:100%;max-height:650px;object-fit:contain;border:1px solid #dde5e7;border-radius:8px"/><figcaption class="tiny">原始考題附圖。含表格的題目，請以圖片排版為準。</figcaption></figure>`:''}<div class="sp"></div>${q.options.map((opt,i)=>{if(!String(opt||'').trim())return '';const a='ABCDE'[i];return `<div class="choice ${a===correct?'correct':a===chosen?'wrong':''}"><span class="optionletter">${a}.</span><span>${escapeHTML(opt)} ${a===correct?' ✓ 正解':''} ${a===chosen&&!ok?' ← 你的答案':''}</span></div>`}).join('')}${answerPanel(q,chosen)}<div class="actions"><button class="btn" data-action="rprev" ${s.index===0?'disabled':''}>上一題</button><button class="btn" data-action="rnext" ${s.index===s.ids.length-1?'disabled':''}>下一題</button><button class="btn primary" data-action="retry-wrong" ${score===s.ids.length?'disabled':''}>重做本回錯題</button></div></section><aside class="card"><h3>逐題檢討進度</h3><div class="numgrid">${s.ids.map((id,i)=>{const qq=state.bank.find(x=>x.id===id);return `<button class="qnum ${s.answers[id]===answer(qq)?'done':'failed'} ${i===s.index?'now':''}" data-action="jump" data-index="${i}">${i+1}</button>`}).join('')}</div><div class="hr"></div><div class="actions"><button class="btn" data-action="finish">回年度列表</button>${s.year!==null&&yearComplete(s.year)?`<button class="btn primary" data-action="year-start" data-year="${s.year}" data-mode="instant">再次逐題練習</button>`:''}${nextAvailable?`<button class="btn soft" data-action="year-start" data-year="${ny}" data-mode="exam">進入下一年（${ny} 年）</button>`:''}</div><p class="small">題號綠色表示與目前答案鍵相符，紅色表示不符。未經獨立核對的答案只能當作暫定標準。</p></aside></div>`}
function renderWrong(){const wrong=state.bank.filter(flagged),mastered=state.bank.filter(q=>state.attempts[q.id]?.wrong>0&&state.attempts[q.id]?.mastered);const item=(q,isMastered)=>`<div class="reportrow"><div><strong>${q.year} 年第 ${q.number} 題</strong> · ${escapeHTML(q.topic||'未分類')} <span class="badge ${isMastered?'good':'bad'}">${isMastered?'已熟悉':'歷史錯題'}</span><div class="small">${escapeHTML(q.text.slice(0,92))}${q.text.length>92?'…':''}</div><div class="small">累積答錯 ${state.attempts[q.id].wrong||0} 次 · 上一次 ${state.attempts[q.id].lastCorrect?'答對':'答錯'}</div></div><button class="btn" data-action="toggle-mastered" data-id="${escapeHTML(q.id)}">${isMastered?'重新加入錯題':'標記已熟悉'}</button></div>`;return `<section class="card"><div class="row wrap"><h2>我的歷史錯題簿</h2><span class="badge bad">待複習 ${wrong.length} 題</span></div><p class="lead">第一次答錯就自動標記，之後即使重做答對，也<strong>不會自動消失</strong>。等你確定掌握後，再手動標成「已熟悉」。</p><div class="actions"><button class="btn primary" data-action="all-wrong" ${wrong.filter(able).length?'':'disabled'}>逐題即時複習全部錯題</button><button class="btn" data-nav="home">回到各年度</button></div>${wrong.length?wrong.map(q=>item(q,false)).join(''):'<div class="notice">目前沒有待複習錯題。先完成一年的整份練習吧。</div>'}${mastered.length?`<div class="hr"></div><h3>已熟悉但保留歷史紀錄（${mastered.length}）</h3>${mastered.map(q=>item(q,true)).join('')}`:''}</section>`}
function renderReview(){const query=state.reviewSearch.toLowerCase().trim();let list=state.bank.filter(q=>(state.reviewYear==='all'||String(q.year)===state.reviewYear)&&(!query||(`${q.text} ${q.year} ${q.number} ${q.topic}`).toLowerCase().includes(query)));const pending=state.bank.filter(q=>q.verified!=='verified').length;return `<div class="two"><section class="card"><h2>逐題答案審核</h2><p class="lead">題庫已附官方答案，但尚未完成全部醫學驗證。審查需對照 Bonica 5th、指引或原始文獻。</p><div class="row wrap"><span class="badge warn">${pending} 題待查證／有爭議</span><button class="btn" data-action="export">匯出備份</button></div><div class="sp"></div><div class="row"><label class="field" style="flex:1">篩選年度<select id="reviewYear"><option value="all">所有年度</option>${YEARS.map(y=>`<option value="${y}" ${state.reviewYear===String(y)?'selected':''}>${y} 年</option>`).join('')}</select></label><label class="field" style="flex:2">關鍵字<input id="reviewSearch" type="text" value="${escapeHTML(state.reviewSearch)}" placeholder="輸入疾病、題號、藥物名稱"></label></div><div class="sp"></div><div class="scrollbox">${list.map(q=>`<div class="reviewitem"><div class="row wrap"><strong>${q.year} 年第 ${q.number} 題 ${q.origin==='adapted'?'（改寫示範）':''}</strong>${status(q)}</div><p class="small">${escapeHTML(q.text.slice(0,125))}${q.text.length>125?'…':''}</p><span class="small">官方：${q.officialAnswer||'—'}　再審：${q.verifiedAnswer||'—'}</span> <button class="linkbtn" data-action="edit-question" data-id="${escapeHTML(q.id)}">檢視／編輯</button></div>`).join('')||'<p class="small">查無符合條件的題目。</p>'}</div></section><aside class="card"><h3>審核原則</h3><p class="small">① 對照原始試卷核對選項與答案；② 用 Bonica 5th 查核關鍵概念；③ 對可能過時或模糊的題目，用較新的 guideline / systematic review 補充；④ 保留原答案、不直接覆蓋，將爭議標成「有爭議」。</p><div class="notice warning">此 HTML 網站無連線醫學資料庫與 AI 自動審查。只有附上可追溯資料並經逐題比對，才能把狀態改成「已核對」。</div></aside></div>`}
function renderEditor(id){const q=state.bank.find(x=>x.id===id);if(!q)return;state.tab='edit';$('#tabs').innerHTML='<button data-nav="review" class="active">← 回答案審核</button>';$('#app').innerHTML=`<section class="card"><div class="row wrap"><h2>${q.year} 年第 ${q.number} 題 — 校對與詳解</h2>${status(q)}</div><p class="small">來源：${q.origin==='official'?'官方 PDF 擷取':'原創示範改寫'}</p><label class="field">題目<textarea id="eText" rows="4">${escapeHTML(q.text)}</textarea></label><div class="sp"></div>${q.options.map((t,i)=>`<label class="field">選項 ${'ABCDE'[i]}<input id="eOpt${i}" value="${escapeHTML(t)}" type="text"></label>`).join('<div style="height:7px"></div>')}<div class="sp"></div><div class="formgrid"><label class="field">官方答案（僅記錄原始鍵）<select id="eOfficial"><option value="">未辨識</option>${['A','B','C','D','E'].map(a=>`<option ${q.officialAnswer===a?'selected':''}>${a}</option>`).join('')}</select></label><label class="field">獨立查證答案<select id="eVerifiedAnswer"><option value="">尚未查證</option>${['A','B','C','D','E'].map(a=>`<option ${q.verifiedAnswer===a?'selected':''}>${a}</option>`).join('')}</select></label><label class="field">審核狀態<select id="eStatus"><option value="pending" ${q.verified==='pending'?'selected':''}>待查證</option><option value="verified" ${q.verified==='verified'?'selected':''}>已獨立核對</option><option value="disputed" ${q.verified==='disputed'?'selected':''}>答案有爭議</option></select></label></div><div class="sp"></div><label class="field">醫學解析<textarea id="eExplanation" rows="5">${escapeHTML(q.explanation||'')}</textarea></label><div class="sp"></div><label class="field">原始 PDF 附註／疑點<textarea id="eNote">${escapeHTML(q.officialNote||'')}</textarea></label><div class="sp"></div><label class="field">引用來源網址（每行一筆 URL）<textarea id="eRefs" rows="3">${escapeHTML((q.sources||[]).map(s=>s.url).join('\n'))}</textarea></label><div class="actions"><button class="btn primary" data-action="save-edit" data-id="${escapeHTML(id)}">儲存校對</button><button class="btn" data-nav="review">返回列表</button></div></section>`}
function startQuiz(ids,shuffle=false,mode='exam',year=null,fullYear=false){ids=ids.filter(id=>{const q=state.bank.find(x=>x.id===id);return q&&able(q)});if(!ids.length){toast('沒有具完整選項及答案的題目。');return}if(shuffle)ids.sort(()=>Math.random()-.5);state.session={ids,index:0,answers:{},submitted:false,mode,year,fullYear,revealed:{}};persistDraft();render();window.scrollTo(0,0)}
function submitQuiz(){const s=state.session;if(!s||s.mode!=='exam')return;const blank=s.ids.filter(id=>!s.answers[id]).length;if(s.fullYear&&blank){toast(`還有 ${blank} 題未作答。第一次整份模擬考必須全部完成才可交卷。`);return}if(blank&&!confirm(`還有 ${blank} 題尚未作答，確定要交卷嗎？`))return;s.submitted=true;s.index=0;for(const id of s.ids)tallyAttempt(id,s.answers[id]);if(s.fullYear&&s.year!==null){const all=yearQuestions(s.year);if(all.length===s.ids.length&&all.every(q=>s.ids.includes(q.id)))state.completedYears[String(s.year)]={ids:[...s.ids],at:new Date().toISOString()}}if(save()&&s.fullYear&&s.year!==null){delete state.drafts[String(s.year)];saveDrafts();}render();window.scrollTo(0,0)}
function confirmInstant(){const s=state.session;if(!s||s.mode!=='instant'||s.submitted)return;const id=s.ids[s.index];if(s.revealed[id])return;if(!s.answers[id]){toast('先選一個答案，才能確認本題。');return}s.revealed[id]=true;tallyAttempt(id,s.answers[id]);save();render();}
function nextInstant(){const s=state.session;if(!s||s.mode!=='instant')return;const id=s.ids[s.index];if(!s.revealed[id]){toast('先確認本題並看解析，再進下一題。');return}if(s.index===s.ids.length-1){s.submitted=true;s.index=0;}else s.index++;render();window.scrollTo({top:0,behavior:'smooth'})}
function exportJSON(){persistDraft();const blob=new Blob([JSON.stringify({format:'pain-exam-v4',exportedAt:new Date().toISOString(),bank:state.bank,attempts:state.attempts,completedYears:state.completedYears,drafts:state.drafts},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='疼痛專科_題庫與練習紀錄_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function sanitizeQuestion(q){let opts=Array.isArray(q.options)?q.options.slice(0,5).map(x=>String(x)):[];return {...q, id:String(q.id||`import-${Date.now()}-${Math.random()}`),year:Number(q.year)||0,number:Number(q.number)||0,text:String(q.text||''),options:opts,officialAnswer: /^[A-E]$/.test(q.officialAnswer||'')?q.officialAnswer:null,verifiedAnswer:/^[A-E]$/.test(q.verifiedAnswer||'')?q.verifiedAnswer:null,verified:['pending','verified','disputed'].includes(q.verified)?q.verified:'pending',sources:Array.isArray(q.sources)?q.sources.filter(x=>x&&/^https?:\/\//.test(x.url||'')):[]}}
function saveEditor(id){let q=state.bank.find(x=>x.id===id);if(!q)return;let ver=$('#eStatus').value,checked=$('#eVerifiedAnswer').value;if(ver==='verified'&&!checked){toast('標記已核對前，請先填入查證答案。');return}q.text=$('#eText').value.trim();q.options=q.options.map((_,i)=>$(`#eOpt${i}`).value.trim());q.officialAnswer=$('#eOfficial').value||null;q.verifiedAnswer=checked||null;q.verified=ver;q.explanation=$('#eExplanation').value.trim();q.officialNote=$('#eNote').value.trim();q.sources=$('#eRefs').value.split(/\r?\n/).map(x=>x.trim()).filter(x=>/^https?:\/\//.test(x)).map((url,i)=>({url,title:`查證文獻 ${i+1}`}));save();state.tab='review';render();toast('答案與審核狀態已儲存')}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b){if(!persistDraft())return;state.session=null;nav(b.dataset.nav)}});
$('#app').addEventListener('change',e=>{if(e.target.name==='answer'&&state.session&&!state.session.submitted){const s=state.session,id=s.ids[s.index];if(s.mode!=='instant'||!s.revealed[id]){s.answers[id]=e.target.value;persistDraft();render()}}if(e.target.id==='yearSelect'){state.setupYear=e.target.value;render()}if(e.target.id==='reviewYear'){state.reviewYear=e.target.value;render()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='reviewSearch'){state.reviewSearch=e.target.value;const pos=e.target.selectionStart;render();const el=$('#reviewSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
$('#app').addEventListener('click',e=>{const b=e.target.closest('button[data-action],button[data-nav]');if(!b)return;const a=b.dataset.action;if(b.dataset.nav){if(!persistDraft())return;state.session=null;nav(b.dataset.nav);return}if(a==='save-exam'){suspendExam();return}if(a==='resume-year'){resumeYear(b.dataset.year);return}if(a==='restart-year'){const y=Number(b.dataset.year);if(!confirm('要捨棄 '+y+' 年尚未交卷的暫存作答，重新開始這一年的整份測驗嗎？'))return;delete state.drafts[String(y)];if(!saveDrafts())return;startYear(y,'exam');return}if(a==='import-json'){$('#jsonFile').click();return}if(a==='export'){exportJSON();return}if(a==='year-start'){startYear(b.dataset.year,b.dataset.mode||'exam');return}if(a==='toggle-mastered'){const entry=state.attempts[b.dataset.id];if(entry){entry.mastered=!entry.mastered;save();render()}return}if(a==='start'){startYear(state.setupYear,$('#modeSelect')?.value||'exam');return}if(a==='all-wrong'){startQuiz(state.bank.filter(flagged).filter(able).map(q=>q.id).sort((a,b)=>a.localeCompare(b)),false,'instant',null,false);return}if(!state.session){if(a==='edit-question')renderEditor(b.dataset.id);if(a==='save-edit')saveEditor(b.dataset.id);return}const s=state.session;if(a==='confirm-instant'){confirmInstant();return}if(a==='next-instant'){nextInstant();return}if(a==='prev'&&s.index>0)s.index--;if(a==='next'&&s.index<s.ids.length-1)s.index++;if(a==='rprev'&&s.index>0)s.index--;if(a==='rnext'&&s.index<s.ids.length-1)s.index++;if(a==='jump'&&(s.mode!=='instant'||s.submitted))s.index=Number(b.dataset.index);if(a==='submit'){submitQuiz();return}if(a==='retry-wrong'){const ids=s.ids.filter(id=>s.answers[id]!==answer(state.bank.find(q=>q.id===id)));startQuiz(ids,false,'instant',null,false);return}if(a==='finish'){state.session=null;state.tab='home'}persistDraft();render();if(['prev','next','rprev','rnext','jump'].includes(a))window.scrollTo({top:0,behavior:'smooth'})});
$('#jsonFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.bank))throw Error('不是支援格式');let n=0;for(const q of data.bank.map(sanitizeQuestion)){let i=state.bank.findIndex(x=>x.id===q.id);if(i>=0)state.bank[i]=q;else state.bank.push(q);n++}if(data.attempts&&typeof data.attempts==='object')state.attempts={...state.attempts,...data.attempts};if(data.completedYears&&typeof data.completedYears==='object')state.completedYears={...state.completedYears,...data.completedYears};if(data.drafts&&typeof data.drafts==='object'&&!Array.isArray(data.drafts)){for(const [y,d] of Object.entries(data.drafts)){if(/^10[5-9]$|^11[0-5]$/.test(y)&&d&&typeof d==='object'&&!d.submitted)state.drafts[y]=d;}saveDrafts();}save();render();toast(`成功匯入 ${n} 題`)}catch(err){alert('JSON 匯入失敗：'+err.message)}});
render();
</script>
</body></html>
